[project]
name = "travel-planner-backend"
version = "0.1.0"
description = "AI Travel Planner — Google ADK agents collaborating over the A2A protocol"
requires-python = ">=3.11"
dependencies = [
    "google-adk[a2a]>=2.15,<3",
    "a2a-sdk[http-server]>=1.3,<2",
    "fastapi>=0.133",
    "uvicorn[standard]>=0.30",
    "httpx>=0.28",
    "pydantic>=2.12",
    "pydantic-settings>=2.6",
    "sse-starlette>=2.1",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = [".venv", ".data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008", "E501", "ASYNC109"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: requires a real Gemini API key (GOOGLE_API_KEY) and running network access"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["\\.venv", "tests/"]
